name: Print Software Versions

on:
  push:
    branches: [ laboratory-work-4 ]

jobs:
  PrintLanguageVersions:
    runs-on: ubuntu-latest
    steps:
      - name: Print .NET Version
        run: dotnet --version
      - name: Print C# Compiler Info
        run: dotnet --info

  PrintDBMSVersions:
    runs-on: ubuntu-latest
    needs: [PrintLanguageVersions]
    steps:
      - name: Print Python Version
        run: python --version
      - name: Print Node.js Version
        run: node --version
